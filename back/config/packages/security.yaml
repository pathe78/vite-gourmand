security:
    password_hashers:
        App\Entity\Utilisateur:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    # Hiérarchie : un admin a aussi les droits employé, un employé ceux d'un utilisateur
    role_hierarchy:
        ROLE_EMPLOYE: ROLE_UTILISATEUR
        ROLE_ADMIN: ROLE_EMPLOYE

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/api/menus, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/contact, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/horaires, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/commandes, roles: ROLE_UTILISATEUR }
        - { path: ^/api/compte, roles: ROLE_UTILISATEUR }
        - { path: ^/api/employe, roles: ROLE_EMPLOYE }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/avis, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/avis, roles: ROLE_UTILISATEUR, methods: [POST] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10