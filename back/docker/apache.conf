<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Toutes les URL inconnues sont envoyées au contrôleur frontal de Symfony
        FallbackResource /index.php
    </Directory>

    # Indispensable pour le JWT : Apache ne transmet pas l'en-tête Authorization à PHP par défaut
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
