<!-- ============================================================
     Page : Nos menus (menus.html)
     Les cartes sont générées dynamiquement depuis l'API
============================================================ -->

<!-- EN-TÊTE -->
<section class="menus-header">
    <div class="container">
        <h1>Nos menus</h1>
        <p>Découvrez l'ensemble de nos menus pour tous vos événements.</p>
    </div>
</section>

<!-- FILTRES -->
<div class="filtres-bar">
    <div class="container">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <label class="filtre-label">Prix max (€)</label>
                <input type="number" id="filtre-prix-max" class="filtre-input" placeholder="ex: 80" />
            </div>
            <div class="col-6 col-md-2">
                <label class="filtre-label">Prix min (€)</label>
                <input type="number" id="filtre-prix-min" class="filtre-input" placeholder="ex: 20" />
            </div>
            <div class="col-6 col-md-2">
                <label class="filtre-label">Thème</label>
                <select id="filtre-theme" class="filtre-input">
                    <option value="">Tous</option>
                    <option value="noel">Noël</option>
                    <option value="paques">Pâques</option>
                    <option value="classique">Classique</option>
                    <option value="evenement">Événement</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="filtre-label">Régime</label>
                <select id="filtre-regime" class="filtre-input">
                    <option value="">Tous</option>
                    <option value="classique">Classique</option>
                    <option value="vegetarien">Végétarien</option>
                    <option value="vegan">Vegan</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="filtre-label">Nb personnes min.</label>
                <input type="number" id="filtre-personnes" class="filtre-input" placeholder="ex: 6" />
            </div>
            <div class="col-6 col-md-2">
                <button id="btn-reset" class="btn-reset w-100">Réinitialiser</button>
            </div>
        </div>
    </div>
</div>

<!-- RÉSULTATS -->
<section class="section">
    <div class="container">
        <p class="resultats-count"><span id="nb-resultats">0</span> menus disponibles</p>

        <!-- Chargement -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2 text-muted">Chargement des menus...</p>
        </div>

        <!-- Grille des menus (générée par menus.js) -->
        <div class="row g-3 d-none" id="menus-container"></div>

        <!-- Aucun résultat -->
        <div id="no-result" class="text-center py-5 d-none">
            <div style="font-size:3rem;">🍽️</div>
            <h3 class="mt-3">Aucun menu trouvé</h3>
            <p class="text-muted">Essayez de modifier vos filtres.</p>
            <button id="btn-reset-2" class="btn-reset mt-2">Réinitialiser les filtres</button>
        </div>

    </div>
</section>
